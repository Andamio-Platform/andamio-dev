        submission on chain in that course (the latest per credential and learner), commitment_status
        derived from chain; saved commitments with no submission on chain are not listed. Per row, the
        evidence shown follows this rule: When the on-chain value is not a hash, Andamio returns the learner''s
        newest saved evidence for that assignment, which may not be the version that was anchored. When
        it is a hash with no evidence saved under it, no evidence is returned. The caller must currently
        teach the course. Without course_id: the submissions awaiting assessment across the caller''s
        courses, from chain only.'
