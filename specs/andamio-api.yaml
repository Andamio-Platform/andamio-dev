          $ref: '#/definitions/DeleteModuleV2Request'
      produces:
      - application/json
      responses:
        '200':
          description: Deletion result
          schema:
            $ref: '#/definitions/SuccessResponse'
        '400':
          description: Invalid request body
          schema:
            $ref: '#/definitions/BadRequestResponse'
        '502':
          description: DB API request failed
          schema:
            $ref: '#/definitions/BadGatewayErrorResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
