      content:
        allOf:
        - $ref: '#/definitions/AssignmentCommitmentContent'
        description: Off-chain content (nested)
      course_id:
        description: Identifiers
        type: string
      course_module_code:
        description: Human-readable module code
        type: string
      on_chain_content:
        description: Hex-encoded on-chain content
        type: string
      on_chain_status:
        description: On-chain student status (from course details)
        type: string
      slt_hash:
        type: string
      source:
        description: Data source indicator
        type: string
      student_alias:
        type: string
      submission_slot:
        type: integer
      submission_tx:
        description: On-chain submission info
        type: string
    required:
    - course_id
    - slt_hash
    - source
    - student_alias
    type: object
  TeacherAssignmentCommitmentsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/TeacherAssignmentCommitmentItem'
        type: array
      meta:
        $ref: '#/definitions/Meta'
    required:
    - data
    type: object
  TeacherDashboard:
    properties:
      courses:
        items:
          $ref: '#/definitions/DashboardCourseSummary'
        type: array
      pending_reviews:
        items:
          $ref: '#/definitions/DashboardPendingReviewSummary'
        type: array
      total_pending_reviews:
        type: integer
    type: object
  TokenListResponse:
    description: List of registered native asset tokens
    properties:
      data:
        items:
          $ref: '#/definitions/TokenRegistryEntry'
        type: array
      meta:
        $ref: '#/definitions/Meta'
    required:
    - data
    type: object
  TokenRegistryEntry:
    properties:
      asset_name:
        example: 416e64616d696f546f6b656e
        type: string
      asset_name_decoded:
        example: AndamioToken
        type: string
      decimals:
        example: 6
        type: integer
      name:
        example: Andamio Token
        type: string
      policy_id:
        example: f4c9f9c4252d86702c2f4c2e49e6648873ca2ac01c8b5c76f2d4da5f
        type: string
      subject:
        example: f4c9f9c4252d86702c2f4c2e49e6648873ca2ac01c8b5c76f2d4da5f416e64616d696f546f6b656e
        type: string
      ticker:
        example: ANDA
        type: string
    required:
    - asset_name
    - asset_name_decoded
    - policy_id
    - subject
    type: object
  TokenResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
    required:
    - expires_at
    - token
    type: object
  UnauthorizedErrorResponse:
    properties:
      details:
        type: string
      message:
        example: 'Unauthorized: Invalid or missing credentials.'
        type: string
      status_code:
        example: 401
        type: integer
    required:
    - message
    - status_code
    type: object
  UnprocessableEntityErrorResponse:
    properties:
      details:
        type: string
      message:
        example: 'Unprocessable Entity: Invalid request structure or data.'
        type: string
      status_code:
        example: 422
        type: integer
    required:
    - message
    - status_code
    type: object
  UnsignedTxResponse:
    properties:
      unsigned_tx:
        type: string
    type: object
  UnsignedTxResponseInitCourse:
    properties:
      course_id:
        description: This is the hash of a minting policy script.
        type: string
      unsigned_tx:
        type: string
    type: object
  UnsignedTxResponseInitProject:
    properties:
      project_id:
        description: This is the hash of a minting policy script.
        type: string
      unsigned_tx:
        type: string
    type: object
  UpdateAccessTokenAliasResponse:
    properties:
      access_token_alias:
        type: string
    type: object
  UpdateAssignmentCommitmentV2Request:
    properties:
      course_id:
        type: string
      course_module_code:
        type: string
      evidence:
        allOf:
        - $ref: '#/definitions/JSONMap'
        description: Evidence is required. Andamio computes the evidence hash from it.
    required:
    - course_id
    - course_module_code
    - evidence
    type: object
  UpdateCourseRequest:
    properties:
      category:
        type: string
      description:
        type: string
      image_url:
        type: string
      is_public:
        type: boolean
      title:
        type: string
      video_url:
        type: string
    type: object
  UpdateModuleStatusRequest:
    properties:
      course_id:
        type: string
      course_module_code:
        type: string
      slt_hash:
        description: Required when status = "APPROVED"
        type: string
      status:
        enum:
        - DRAFT
        - APPROVED
        type: string
    type: object
  UpdateModuleV2:
    properties:
      allowed_student_state_ids:
        items:
          type: string
        type: array
      prereq_credential_hashes:
        items:
          type: string
        type: array
      slt_hash:
        description: Hex-encoded hash of the module's SLT list, which is also its on-chain token name
          (exactly 64 characters).
        type: string
    type: object
  UpdateProjectRequest:
    properties:
      category:
        type: string
      description:
        type: string
      image_url:
        type: string
      is_public:
        type: boolean
      title:
        type: string
      video_url:
        type: string
    type: object
  UpdateTaskRequest:
    properties:
      content:
        example: Build a responsive login page
        type: string
      content_json:
        additionalProperties: true
        type: object
      contributor_state_id:
        example: policy_xyz789
        type: string
      expiration_time:
        example: '1735689600000'
        type: string
      index:
        example: 0
        type: integer
      lovelace_amount:
        example: '5000000'
        type: string
      title:
        example: Build login page
        type: string
      tokens:
        items:
          $ref: '#/definitions/CreateTaskToken'
        type: array
    required:
    - contributor_state_id
    - index
    type: object
  ValidTxTypesResponse:
    description: List of valid transaction types that can be registered with the TX State Machine.
    properties:
      types:
        description: List of valid transaction type strings
        example:
        - course_create
        - assignment_submit
        - access_token_mint
        items:
          type: string
        type: array
    type: object
  ValidateSignatureRequest:
    description: Validates CIP-30/CIP-8 wallet signature and returns JWT token.
    properties:
      access_token_alias:
        description: Access token alias (e.g. 'falcon'). For CLI/agent headless login.
        example: falcon
        type: string
      address:
        description: Wallet address in bech32 or hex format
        example: addr_test1qq...
        type: string
      andamio_access_token_unit:
        description: Full access token unit (policyId + hex-encoded name). For browser wallets.
        type: string
      id:
        description: Session ID from /auth/login/session
        example: session-123
        type: string
      signature:
        allOf:
        - $ref: '#/definitions/SignatureData'
        description: CIP-30 wallet signature
      wallet_preference:
        description: Wallet name for debugging
        type: string
    required:
    - id
    - signature
    type: object
  VerificationFailureResponse:
    description: Response when verification fails, containing error details.
    properties:
      error:
        description: "Error is a machine-readable error code.\n\t@example\tsession_expired"
        type: string
      message:
        description: "Message is a human-readable error description.\n\t@example\tThe verification session\
          \ has expired. Please start a new session."
        type: string
      verified:
        description: "Verified is always false for failure responses.\n\t@example\tfalse"
        type: boolean
    type: object
externalDocs:
  description: OpenAPI Specification
  url: https://swagger.io/resources/open-api/
info:
  contact:
    email: support@andamio.io
    name: Andamio API Support
    url: https://andamio.io/support
  description: 'Andamio is a system for issuing credentials and granting role-based access to holders
    of those credentials. This API is one way to interact with Andamio. You can also build your own. Use
    this as a reference to learn how Andamio works and as a starting point for your own integrations.

    Pagination convention: every paginated list response carries its state at `meta.pagination`. Snapshot
    lists (finite, re-orderable) use `page`+`limit` query params and return `{page, page_size, total}`.
    Append-only feeds (activity/audit streams that only grow) use `cursor`+`limit` and return `{next_cursor,
    has_more}` — no `total`/`count`, since counting an open-ended feed isn''t a stable operation. The
    `cursor` token is opaque: treat it as an opaque string, never parse or construct one client-side.'
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://andamio.io/terms
  title: Andamio API Gateway
  version: 0.0.0
paths:
  /v2/auth/login/session:
    post:
      description: Initiates wallet-based authentication by generating a nonce for CIP-30 signing.
      operationId: v2-db-auth-login-session
      produces:
      - application/json
      responses:
        '200':
          description: Login session with nonce
          schema:
            $ref: '#/definitions/LoginSession'
        '401':
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/UnauthorizedErrorResponse'
        '502':
          description: Login could not be completed, please retry
          schema:
            $ref: '#/definitions/BadGatewayErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Initiate login session
      tags:
      - Auth/User
      x-access-level: public
  /v2/auth/login/validate:
    post:
      consumes:
      - application/json
      description: Validates CIP-30 wallet signature and returns JWT token for authenticated sessions.
      operationId: v2-db-auth-login-validate
      parameters:
      - description: Signature validation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ValidateSignatureRequest'
      produces:
      - application/json
      responses:
        '200':
          description: JWT token response
          schema:
            $ref: '#/definitions/TokenResponse'
        '400':
          description: Invalid request body
          schema:
            $ref: '#/definitions/BadRequestResponse'
        '401':
          description: Missing or invalid API key, or invalid signature
          schema:
            $ref: '#/definitions/UnauthorizedErrorResponse'
        '502':
          description: Login could not be completed, please retry
          schema:
            $ref: '#/definitions/BadGatewayErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Validate wallet signature
      tags:
      - Auth/User
      x-access-level: public
  /v2/course/owner/course/register:
    post:
      consumes:
      - application/json
      description: Registers an existing on-chain course so it can carry off-chain content. Only the course's
        on-chain owner may register it. Requires an end-user access token. A course not yet indexed answers
        404.
      operationId: v2-course-owner-register
      parameters:
      - description: Course registration request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RegisterCourseV2Request'
      produces:
      - application/json
      responses:
        '200':
          description: Registered course
          schema:
            $ref: '#/definitions/Course'
        '400':
          description: Invalid request body
          schema:
            $ref: '#/definitions/BadRequestResponse'
        '401':
          description: Requires an end-user access token
          schema:
            $ref: '#/definitions/UnauthorizedErrorResponse'
        '403':
          description: The caller is not the course's on-chain owner
          schema:
            $ref: '#/definitions/ForbiddenErrorResponse'
        '404':
          description: Course not found on chain
          schema:
            $ref: '#/definitions/NotFoundErrorResponse'
        '502':
          description: The chain read or the off-chain content request failed
          schema:
            $ref: '#/definitions/BadGatewayErrorResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      summary: Register course
      tags:
      - Course/Owner
      x-access-level: public
  /v2/course/owner/course/update:
    post:
      consumes:
      - application/json
      description: Updates an existing course.
      operationId: v2-course-owner-update
      parameters:
      - description: Course update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateCourseRequest'
      produces:
      - application/json
      responses:
        '200':
          description: Updated course
          schema:
            $ref: '#/definitions/Course'
        '400':
          description: Invalid request body
          schema:
            $ref: '#/definitions/BadRequestResponse'
        '409':
          description: Course was modified concurrently; retry with a fresh read
          schema:
            $ref: '#/definitions/ConflictErrorResponse'
        '502':
          description: Off-chain content request failed
          schema:
            $ref: '#/definitions/BadGatewayErrorResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      summary: Update course
      tags:
      - Course/Owner
      x-access-level: public
  /v2/course/owner/courses/list:
    post:
      description: Returns courses owned by the authenticated user (from chain, enriched with off-chain
        content)
      operationId: v2-merged-course-owner-list
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/MergedCoursesResponse'
        '206':
          description: Partial content (on-chain or off-chain data not available)
          schema:
            $ref: '#/definitions/MergedCoursesResponse'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        '502':
          description: Neither on-chain nor off-chain data available
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      summary: List my courses
      tags:
      - Course/Owner
      x-access-level: public
  /v2/course/student/assignment-commitment/get:
    post:
      consumes:
      - application/json
      description: Returns one of the caller's assignment commitments. commitment_status is derived from
        the learner's submission on chain; a saved commitment with no submission on chain is AWAITING_SUBMISSION.
        When the on-chain value is not a hash, Andamio returns the learner's newest saved evidence for
        that assignment, which may not be the version that was anchored. When it is a hash with no evidence
        saved under it, no evidence is returned.
      operationId: v2-merged-course-student-commitment-get
      parameters:
      - description: Course ID and Module Code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/GetStudentAssignmentCommitmentRequest'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/StudentAssignmentCommitmentResponse'
        '206':
          description: 'Partial content: the on-chain progress (on_chain_status) or the saved evidence
            could not be read, or the chain status is not recognised and commitment_status is left out;
            meta.warning says which'
          schema:
            $ref: '#/definitions/StudentAssignmentCommitmentResponse'
        '400':
          description: Invalid request body, or course_id or slt_hash missing
          schema:
            $ref: '#/definitions/ErrorResponse'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        '404':
          description: Commitment not found
          schema:
            $ref: '#/definitions/ErrorResponse'
        '502':
          description: The on-chain submission, or the saved commitment when there is none on chain, could
            not be read
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      summary: Get commitment
      tags:
      - Course/Student
      x-access-level: public
  /v2/course/student/assignment-commitments/list:
    post:
      consumes:
      - application/json
      description: Returns the caller's assignment commitments, optionally for one course. commitment_status
        is derived from the learner's submissions on chain; a saved commitment with no submission on chain
        is AWAITING_SUBMISSION. When the on-chain value is not a hash, Andamio returns the learner's newest
        saved evidence for that assignment, which may not be the version that was anchored. When it is
        a hash with no evidence saved under it, no evidence is returned.
      operationId: v2-merged-course-student-commitments-list
      parameters:
      - description: Optional course_id to filter commitments
        in: body
        name: request
        schema:
          $ref: '#/definitions/ListStudentAssignmentCommitmentsRequest'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/StudentAssignmentCommitmentsResponse'
        '206':
          description: 'Partial content: some data is missing, and meta.warning says what. One or more
            of these applies: the saved commitments could not be read, so only the commitments on chain
            are listed (without drafts, module codes or evidence); the on-chain progress (on_chain_status)
            of a course could not be read; a commitment''s chain status was not recognised, so its commitment_status
            is left out.'
          schema:
            $ref: '#/definitions/StudentAssignmentCommitmentsResponse'
        '400':
          description: Invalid request body
          schema:
            $ref: '#/definitions/ErrorResponse'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        '502':
          description: The on-chain submissions could not be read
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      summary: List my commitments
      tags:
      - Course/Student
      x-access-level: public
  /v2/course/student/commitment/submit:
    post:
      consumes:
      - application/json
      description: 'Saves the caller''s evidence (required) for teacher review. Andamio computes the evidence
        hash from `evidence` (andamio-core commitment-hash canonical-v1) and returns it in the response
        as assignment_evidence_hash; the caller does not send a hash. Creates it (201), or answers the
        evidence already saved under the same hash (200; saved evidence is never replaced). Earlier saves
        are kept: the evidence shown with a submission is the one saved under the hash on chain. The submission
        itself is the commit transaction. commitment_status and assignment_outcome are read from chain;
        when that read fails the write still succeeds and both fields are absent, meaning unknown: read
        the commitment again.'
      operationId: v2-course-student-submit-commitment
      parameters:
      - description: Commitment submit request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/SubmitAssignmentCommitmentV2Request'
      produces:
      - application/json
      responses:
        '200':
          description: Evidence already saved
          schema:
            $ref: '#/definitions/AssignmentCommitmentRecord'
        '201':
          description: Evidence saved
          schema:
            $ref: '#/definitions/AssignmentCommitmentRecord'
        '400':
          description: Invalid request body, a missing required field (evidence is required), or evidence
            containing invalid UTF-8 or a lone UTF-16 surrogate
          schema:
            $ref: '#/definitions/BadRequestResponse'
        '401':
          description: Requires a learner's login
          schema:
            $ref: '#/definitions/UnauthorizedErrorResponse'
        '404':
          description: Module or assignment not found
          schema:
            $ref: '#/definitions/NotFoundErrorResponse'
        '500':
          description: The commitment could not be saved
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
        '502':
          description: The commitment could not be saved
          schema:
            $ref: '#/definitions/BadGatewayErrorResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      summary: Submit commitment
      tags:
      - Course/Student
      x-access-level: public
  /v2/course/student/commitment/update:
    post:
      consumes:
      - application/json
      description: 'Saves the caller''s evidence (required) for the module''s assignment. Andamio computes
        the evidence hash from `evidence` (andamio-core commitment-hash canonical-v1) and returns it in
        the response as assignment_evidence_hash; the caller does not send a hash. Creates it (201), or
        answers the evidence already saved under the same hash (200; saved evidence is never replaced).
        Earlier saves are kept: the evidence shown with a submission is the one saved under the hash on
        chain. commitment_status and assignment_outcome are read from chain; when that read fails the
        update still succeeds and both fields are absent, meaning unknown: read the commitment again.'
      operationId: v2-course-student-update-commitment
      parameters:
      - description: Commitment update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateAssignmentCommitmentV2Request'
      produces:
      - application/json
      responses:
        '200':
          description: Evidence already saved
          schema:
            $ref: '#/definitions/AssignmentCommitmentRecord'
        '201':
          description: Evidence saved
          schema:
            $ref: '#/definitions/AssignmentCommitmentRecord'
        '400':
          description: Invalid request body, a missing required field (evidence is required), or evidence
            containing invalid UTF-8 or a lone UTF-16 surrogate
          schema:
            $ref: '#/definitions/BadRequestResponse'
        '401':
          description: Requires a learner's login
          schema:
            $ref: '#/definitions/UnauthorizedErrorResponse'
        '404':
          description: Module or assignment not found
          schema:
            $ref: '#/definitions/NotFoundErrorResponse'
        '500':
          description: The commitment could not be saved
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
        '502':
          description: The commitment could not be saved
          schema:
            $ref: '#/definitions/BadGatewayErrorResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      summary: Update commitment evidence
      tags:
      - Course/Student
      x-access-level: public
  /v2/course/student/courses/list:
    post:
      description: Returns courses the authenticated student is enrolled in or has completed
      operationId: v2-merged-course-student-list
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/StudentCoursesResponse'
        '206':
          description: Partial content (on-chain or off-chain data not available)
          schema:
            $ref: '#/definitions/StudentCoursesResponse'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        '502':
          description: Neither on-chain nor off-chain data available
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      summary: List my courses
      tags:
      - Course/Student
      x-access-level: public
  /v2/course/student/credentials/list:
    post:
      description: 'Returns the authenticated student''s full credential record: enrolled courses, completed
        courses with claimed credential hashes, and module metadata.'
      operationId: v2-merged-course-student-credentials-list
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/StudentCredentialsResponse'
        '206':
          description: Partial content (off-chain content not available)
          schema:
            $ref: '#/definitions/StudentCredentialsResponse'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        '502':
          description: On-chain state not available
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      summary: List my credentials
      tags:
      - Course/Student
      x-access-level: public
  /v2/course/teacher/assignment-commitment/review:
    post:
      consumes:
      - application/json
      description: 'Checks a review of a learner''s assignment submission and answers with the commitment.
        Records nothing: the decision that counts is the assess transaction, and commitment_status is
        read from chain. Only a current teacher of the course may call it; an owner who is not also a
        teacher may not.'
      operationId: v2-course-teacher-review-commitment
      parameters:
      - description: Review commitment request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ReviewAssignmentCommitmentV2Request'
      produces:
      - application/json
      responses:
        '200':
          description: The commitment, its status read from chain. commitment_status and assignment_outcome
            are absent when the module has no slt_hash
          schema:
            $ref: '#/definitions/AssignmentCommitmentRecord'
        '400':
          description: Invalid request body, missing field, or decision not accept or refuse
          schema:
            $ref: '#/definitions/BadRequestResponse'
        '401':
          description: Requires a learner's login (end-user JWT); an API key alone or a developer JWT
            is not enough
          schema:
            $ref: '#/definitions/UnauthorizedErrorResponse'
        '403':
          description: Caller is not a current teacher of the course (owners only when also a teacher)
          schema:
            $ref: '#/definitions/ForbiddenErrorResponse'
        '404':
          description: No commitment by this learner for this module
          schema:
            $ref: '#/definitions/NotFoundErrorResponse'
        '502':
          description: The teacher role, the commitments or the on-chain status could not be read
          schema:
            $ref: '#/definitions/BadGatewayErrorResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      summary: Review commitment
      tags:
