        example: f4c9f9c4252d86702c2f4c2e49e6648873ca2ac01c8b5c76f2d4da5f
        type: string
      subject:
        example: f4c9f9c4252d86702c2f4c2e49e6648873ca2ac01c8b5c76f2d4da5f416e64616d696f546f6b656e
        type: string
      ticker:
        example: ANDA
        type: string
    required:
    - asset_name
    - asset_name_decoded
    - policy_id
    - subject
    type: object
  TokenResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
    required:
    - expires_at
    - token
    type: object
  TooManyRequestsErrorResponse:
    properties:
      details:
        type: string
      message:
        example: 'Too Many Requests: Rate limit or quota exceeded.'
        type: string
      status_code:
        example: 429
        type: integer
    required:
    - message
    - status_code
    type: object
  TxStatsResponse:
    description: Statistics about the TX State Machine for monitoring and debugging.
    properties:
      confirmed_count:
        description: Number of transactions confirmed on-chain
        example: 142
        type: integer
      expired_count:
        description: Number of expired transactions (not confirmed within timeout)
        example: 0
        type: integer
      failed_count:
        description: Number of failed transactions
        example: 2
        type: integer
      pending_count:
        description: Number of transactions in pending state
        example: 5
        type: integer
      queue_length:
        description: Current length of the confirmation queue
        example: 3
        type: integer
      type_breakdown:
        additionalProperties:
          format: int64
          type: integer
        description: Breakdown of pending transactions by type
        type: object
      updated_count:
        description: Number of transactions with completed DB updates
        example: 140
        type: integer
    type: object
  UnauthorizedErrorResponse:
    properties:
      details:
        type: string
      message:
        example: 'Unauthorized: Invalid or missing credentials.'
        type: string
      status_code:
        example: 401
        type: integer
    required:
    - message
    - status_code
    type: object
  UnprocessableEntityErrorResponse:
    properties:
      details:
        type: string
      message:
        example: 'Unprocessable Entity: Invalid request structure or data.'
        type: string
      status_code:
        example: 422
        type: integer
    required:
    - message
    - status_code
    type: object
  UnsignedTxResponse:
    properties:
      unsigned_tx:
        type: string
    type: object
  UnsignedTxResponseInitCourse:
    properties:
      course_id:
        description: This is the hash of a minting policy script.
        type: string
      unsigned_tx:
        type: string
    type: object
  UnsignedTxResponseInitProject:
    properties:
      project_id:
        description: This is the hash of a minting policy script.
        type: string
      unsigned_tx:
        type: string
    type: object
  UpdateAssignmentCommitmentV2Request:
    properties:
      course_id:
        type: string
      course_module_code:
        type: string
      evidence:
        additionalProperties: true
        type: object
      evidence_hash:
        type: string
    type: object
  UpdateCourseRequest:
    properties:
      category:
        type: string
      description:
        type: string
      image_url:
        type: string
      is_public:
        type: boolean
      title:
        type: string
      video_url:
        type: string
    type: object
  UpdateModuleStatusRequest:
    properties:
      course_id:
        type: string
      course_module_code:
        type: string
      slt_hash:
        description: Required when status = "APPROVED"
        type: string
      status:
        description: '"DRAFT", "APPROVED", or "PENDING_TX"'
        type: string
    type: object
  UpdateModuleV2:
    properties:
      allowed_student_state_ids:
        items:
          type: string
        type: array
      prereq_slt_hashes:
        items:
          type: string
        type: array
      slt_hash:
        description: Hex-encoded hash of the SLT (exactly 64 characters).
        type: string
    type: object
  UpdateProjectRequest:
    properties:
      category:
        type: string
      description:
        type: string
      image_url:
        type: string
      is_public:
        type: boolean
      title:
        type: string
      video_url:
        type: string
    type: object
  UpdateTaskCommitmentRequest:
    properties:
      evidence:
        additionalProperties: true
        type: object
      evidence_hash:
        example: ev_hash_456
        type: string
      task_hash:
        example: hash_abc123
        type: string
    required:
    - task_hash
    type: object
  UpdateTaskRequest:
    properties:
      content:
        example: Build a responsive login page
        type: string
      content_json:
        additionalProperties: true
        type: object
      contributor_state_id:
        example: policy_xyz789
        type: string
      expiration_time:
        example: '1735689600000'
        type: string
      index:
        example: 0
        type: integer
      lovelace_amount:
        example: '5000000'
        type: string
      title:
        example: Build login page
        type: string
      tokens:
        items:
          $ref: '#/definitions/CreateTaskToken'
        type: array
    required:
    - contributor_state_id
    - index
    type: object
  UsageResponse:
    properties:
      daily_quota_consumed:
        example: 50
        type: integer
      daily_quota_limit:
        example: 1000
        type: integer
      expiration:
        example: '2026-08-31T23:59:59Z'
        type: string
      monthly_quota_consumed:
        example: 500
        type: integer
      monthly_quota_limit:
        example: 10000
        type: integer
      rate_limit_windows:
        example:
        - '["100 req/min"'
        - ' "1000 req/day"'
        - ' "10000 req/month"]'
        items:
          type: string
        type: array
      remaining_daily:
        example: 950
        type: integer
      remaining_monthly:
        example: 9500
        type: integer
      subscription_tier:
        example: Free
        type: string
    type: object
  ValidTxTypesResponse:
    description: List of valid transaction types that can be registered with the TX State Machine.
    properties:
      types:
        description: List of valid transaction type strings
        example:
        - course_create
        - assignment_submit
        - access_token_mint
        items:
          type: string
        type: array
    type: object
  ValidateSignatureRequest:
    description: Validates CIP-30/CIP-8 wallet signature and returns JWT token.
    properties:
      access_token_alias:
        description: Access token alias (e.g. 'falcon'). For CLI/agent headless login.
        example: falcon
        type: string
      address:
        description: Wallet address in bech32 or hex format
        example: addr_test1qq...
        type: string
      andamio_access_token_unit:
        description: Full access token unit (policyId + hex-encoded name). For browser wallets.
        type: string
      id:
        description: Session ID from /auth/login/session
        example: session-123
        type: string
      signature:
        allOf:
        - $ref: '#/definitions/SignatureData'
        description: CIP-30 wallet signature
      wallet_preference:
        description: Wallet name for debugging
        type: string
    required:
    - id
    - signature
    type: object
  VerificationFailureResponse:
    description: Response when verification fails, containing error details.
    properties:
      error:
        description: "Error is a machine-readable error code.\n\t@example\tsession_expired"
        type: string
      message:
        description: "Message is a human-readable error description.\n\t@example\tThe verification session\
          \ has expired. Please start a new session."
        type: string
      verified:
        description: "Verified is always false for failure responses.\n\t@example\tfalse"
        type: boolean
    type: object
  VerifyEmailRequest:
    properties:
      token:
        example: dGVzdC10b2tlbg==
        type: string
      token_id:
        example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        type: string
    required:
    - token
    - token_id
    type: object
  VerifyEmailResponse:
    properties:
      alias:
        example: johndoe
        type: string
      email_verified:
        example: true
        type: boolean
      jwt:
        $ref: '#/definitions/JWTResponse'
      message:
        example: Email verified successfully
        type: string
      user_id:
        example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        type: string
    type: object
externalDocs:
  description: OpenAPI Specification
  url: https://swagger.io/resources/open-api/
info:
  contact:
    email: support@andamio.io
    name: Andamio API Support
    url: https://andamio.io/support
  description: 'Andamio is a system for issuing credentials and granting role-based access to holders
    of those credentials. This API is one way to interact with Andamio. You can also build your own. Use
    this as a reference to learn how Andamio works and as a starting point for your own integrations.

    Pagination convention (ratified api#622): every paginated list response carries its state at `meta.pagination`.
    Snapshot lists (finite, re-orderable) use `page`+`limit` query params and return `{page, page_size,
    total}`. Append-only feeds (activity/audit streams that only grow) use `cursor`+`limit` and return
    `{next_cursor, has_more}` — no `total`/`count`, since counting an open-ended feed isn''t a stable
    operation. The `cursor` token is opaque: treat it as an opaque string, never parse or construct one
    client-side.'
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://andamio.io/terms
  title: Andamio API Gateway
paths:
  /v2/auth/login/session:
    post:
      description: Initiates wallet-based authentication by generating a nonce for CIP-30 signing.
      operationId: v2-db-auth-login-session
      produces:
      - application/json
      responses:
        '200':
          description: Login session with nonce
          schema:
            $ref: '#/definitions/LoginSession'
        '401':
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/UnauthorizedErrorResponse'
        '502':
          description: DB API request failed
          schema:
            $ref: '#/definitions/BadGatewayErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Initiate login session
      tags:
      - Auth/User
      x-access-level: public
  /v2/auth/login/validate:
    post:
      consumes:
      - application/json
      description: Validates CIP-30 wallet signature and returns JWT token for authenticated sessions.
      operationId: v2-db-auth-login-validate
      parameters:
      - description: Signature validation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ValidateSignatureRequest'
      produces:
      - application/json
      responses:
        '200':
          description: JWT token response
          schema:
            $ref: '#/definitions/TokenResponse'
        '400':
          description: Invalid request body
          schema:
            $ref: '#/definitions/BadRequestResponse'
        '401':
          description: Missing or invalid API key, or invalid signature
          schema:
            $ref: '#/definitions/UnauthorizedErrorResponse'
        '502':
          description: DB API request failed
          schema:
            $ref: '#/definitions/BadGatewayErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Validate wallet signature
      tags:
      - Auth/User
      x-access-level: public
  /v2/course/owner/course/create:
    post:
      consumes:
      - application/json
      description: Creates a new course in the database using V2 schema.
      operationId: v2-course-owner-create
      parameters:
      - description: Course creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateCourseRequest'
      produces:
      - application/json
      responses:
        '200':
          description: Created course
          schema:
            $ref: '#/definitions/Course'
        '400':
          description: Invalid request body
          schema:
            $ref: '#/definitions/BadRequestResponse'
        '502':
          description: DB API request failed
          schema:
            $ref: '#/definitions/BadGatewayErrorResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      summary: Create course
      tags:
      - Course/Owner
      x-access-level: public
  /v2/course/owner/course/register:
    post:
      consumes:
      - application/json
      description: Registers an existing on-chain course in the database using V2 schema.
      operationId: v2-course-owner-register
      parameters:
      - description: Course registration request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RegisterCourseV2Request'
      produces:
      - application/json
      responses:
        '200':
          description: Registered course
          schema:
            $ref: '#/definitions/Course'
        '400':
          description: Invalid request body
          schema:
            $ref: '#/definitions/BadRequestResponse'
        '502':
          description: DB API request failed
          schema:
            $ref: '#/definitions/BadGatewayErrorResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      summary: Register course
      tags:
      - Course/Owner
      x-access-level: public
  /v2/course/owner/course/update:
    post:
      consumes:
      - application/json
      description: Updates an existing course using V2 schema.
      operationId: v2-course-owner-update
      parameters:
      - description: Course update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateCourseRequest'
      produces:
      - application/json
      responses:
        '200':
          description: Updated course
          schema:
            $ref: '#/definitions/Course'
        '400':
          description: Invalid request body
          schema:
            $ref: '#/definitions/BadRequestResponse'
        '409':
          description: Course was modified concurrently; retry with a fresh read (db-api#244)
          schema:
            $ref: '#/definitions/ConflictErrorResponse'
        '502':
          description: DB API request failed
          schema:
            $ref: '#/definitions/BadGatewayErrorResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      summary: Update course
      tags:
      - Course/Owner
      x-access-level: public
  /v2/course/owner/courses/list:
    post:
      description: Returns courses owned by the authenticated user (from Andamioscan, enriched with DB
        content)
      operationId: v2-merged-course-owner-list
