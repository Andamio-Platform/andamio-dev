          schema:
            $ref: '#/definitions/TeacherAssignmentCommitmentsResponse'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        '502':
          description: Failed to fetch assignment commitments
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      summary: List pending reviews
      tags:
      - Course/Teacher
      x-access-level: public
  /v2/course/teacher/course-module/create:
