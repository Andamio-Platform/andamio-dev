      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/MergedCoursesResponse'
        '206':
          description: Partial content (one backend unavailable)
          schema:
            $ref: '#/definitions/MergedCoursesResponse'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        '502':
          description: Both backends unavailable
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      summary: List my courses
      tags:
      - Course/Owner
      x-access-level: public
  /v2/course/student/assignment-commitment/get:
