  /v2/keys:
    get:
      description: Returns the unified list of the developer's active API keys across both environments.
        Mainnet keys come from the local api_keys table; Preprod keys come from cross_env_key_metadata
        cached at create time. Sorted DESC by created_at. Mainnet entries do not carry last4 (the legacy
        table stores only the bcrypt hash + key_prefix shard); Preprod entries do.
      operationId: v2-keys-list
      produces:
      - application/json
      responses:
        '200':
          description: Unified list of keys
          schema:
            $ref: '#/definitions/ListKeysResponse'
        '401':
          description: Missing or invalid authentication
          schema:
            $ref: '#/definitions/UnauthorizedErrorResponse'
        '500':
          description: Internal error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: List API keys
      tags:
      - Keys
      x-access-level: public
    post:
      consumes:
      - application/json
      description: Creates a developer API key in the requested environment. env=mainnet creates locally;
        env=preprod proxies to the Preprod gateway via the cross-env channel. Tier-cap (union of mainnet
        + preprod active keys) applies to both envs. The raw key value is returned exactly once.
      operationId: v2-keys-create
      parameters:
      - description: Key creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateKeyRequest'
      produces:
      - application/json
      responses:
        '200':
          description: Key created
          schema:
            $ref: '#/definitions/CreateKeyResponse'
        '400':
          description: Malformed request body
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        '401':
          description: Missing or invalid authentication
          schema:
            $ref: '#/definitions/UnauthorizedErrorResponse'
        '403':
          description: Email not verified, or subscription expired (env=mainnet legacy path)
          schema:
            $ref: '#/definitions/ForbiddenErrorResponse'
        '409':
          description: Direct-user collision on cross-env path
          schema:
            $ref: '#/definitions/ConflictErrorResponse'
        '422':
          description: Validation failed (invalid environment, name)
          schema:
            $ref: '#/definitions/UnprocessableEntityErrorResponse'
        '429':
          description: Tier API-key limit reached
          schema:
            $ref: '#/definitions/TooManyRequestsErrorResponse'
        '500':
          description: Internal error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
        '503':
          description: Preprod routing disabled or upstream unavailable
          schema:
            $ref: '#/definitions/ServiceUnavailableErrorResponse'
      security:
      - BearerAuth: []
      summary: Create API key
      tags:
      - Keys
      x-access-level: public
  /v2/keys/{id}:
    delete:
      description: Revokes the developer's API key with the given local id. If the id matches a cross_env_key_metadata
        row, the revoke is proxied to the Preprod gateway and the local row is marked revoked on success;
        a Preprod 404 is treated as success (already gone). Otherwise falls back to the legacy api_keys
        row. A stranger's id returns 404 indistinguishable from non-existence.
      operationId: v2-keys-delete
      parameters:
      - description: Local key id (UUID)
        in: path
        name: id
        required: true
        type: string
      responses:
        '204':
          description: Key revoked
        '400':
          description: Malformed UUID
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        '401':
          description: Missing or invalid authentication
          schema:
            $ref: '#/definitions/UnauthorizedErrorResponse'
        '403':
          description: Access blocked (IP allowlist or abuse blacklist)
          schema:
            $ref: '#/definitions/ForbiddenErrorResponse'
        '404':
          description: Key not found (or owned by another user)
          schema:
            $ref: '#/definitions/NotFoundErrorResponse'
        '500':
          description: Internal error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
        '503':
          description: Preprod routing disabled or upstream unavailable
          schema:
            $ref: '#/definitions/ServiceUnavailableErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete API key
      tags:
      - Keys
      x-access-level: public
