      - Course/Student
      x-access-level: public
  /v2/course/student/credentials/list:
    post:
      description: 'Returns the authenticated student''s full credential record: enrolled courses, completed
        courses with claimed credential hashes, and module metadata from the DB.'
      operationId: v2-merged-course-student-credentials-list
