        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        '502':
          description: Andamioscan unavailable
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      summary: List my credentials
      tags:
      - Course/Student
      x-access-level: public
  /v2/course/teacher/assignment-commitment/review:
    post:
      consumes:
      - application/json
      description: Accepts or refuses a student's assignment submission using V2 schema.
      operationId: v2-course-teacher-review-commitment
      parameters:
      - description: Review commitment request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ReviewAssignmentCommitmentV2Request'
      produces:
      - application/json
      responses:
        '200':
