  /v2/verify/complete:
    post:
      consumes:
      - application/json
      description: 'Completes Access Token ownership verification: validates the CIP-30 wallet signature,
        then confirms the signing wallet actually holds the alias''s on-chain access-token unit. Returns
        a signed JWT attestation (only on both checks passing) that can be verified offline using the
        JWKS endpoint.'
      operationId: v2-verify-complete
      parameters:
      - description: Session ID and CIP-30 signature
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CompleteVerificationRequest'
      produces:
      - application/json
      responses:
        '200':
          description: Verification successful
          schema:
            $ref: '#/definitions/CompleteVerificationResponse'
        '400':
          description: session_expired, session_already_used, invalid_signature, wallet_not_holder
          schema:
            $ref: '#/definitions/VerificationFailureResponse'
        '401':
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/UnauthorizedErrorResponse'
        '422':
          description: Validation failed
          schema:
            $ref: '#/definitions/UnprocessableEntityErrorResponse'
        '500':
          description: Internal server error
          schema:
            $ref: '#/definitions/InternalServerErrorResponse'
        '503':
          description: Chain provider unavailable for the wallet-holder check
          schema:
            $ref: '#/definitions/ServiceUnavailableErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Complete verification
      tags:
      - Verify
      x-access-level: public
  /v2/verify/session:
    post:
      consumes:
      - application/json
      description: Initiates an Access Token ownership verification session. Validates that the alias
        exists on-chain and returns a nonce for the wallet to sign using CIP-30.
      operationId: v2-verify-session
      parameters:
      - description: Alias to verify ownership of
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/StartVerificationRequest'
      produces:
      - application/json
      responses:
        '200':
          description: Session created successfully
          schema:
            $ref: '#/definitions/StartVerificationResponse'
        '400':
          description: alias_not_found or invalid request
          schema:
            $ref: '#/definitions/BadRequestErrorResponse'
        '401':
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/UnauthorizedErrorResponse'
        '422':
          description: Validation failed
          schema:
            $ref: '#/definitions/UnprocessableEntityErrorResponse'
        '503':
          description: Andamioscan unavailable
          schema:
            $ref: '#/definitions/ServiceUnavailableErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Start verification session
      tags:
      - Verify
      x-access-level: public
securityDefinitions:
  ApiKeyAuth:
    description: Your developer API key. Get one at /api/v1/apikey
    in: header
    name: X-API-Key
    type: apiKey
  BearerAuth:
    description: 'JWT bearer token. Accepts either an HS256 DB-API end-user JWT (issued at wallet login;
      alias = accessTokenAlias claim) or an RS256 gateway developer JWT (issued by /v2/auth/developer/login;
      alias = X-API-Key user). Dispatched by the JWT header''s alg. Malformed, expired, or wrong-algorithm
      tokens return HTTP 401. Format: "Bearer <jwt>".'
    in: header
    name: Authorization
    type: apiKey
