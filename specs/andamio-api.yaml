      - description: Commitment update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateAssignmentCommitmentV2Request'
      produces:
      - application/json
      responses:
        '200':
          description: Updated commitment
          schema:
            $ref: '#/definitions/AssignmentCommitment'
        '400':
          description: Invalid request body
          schema:
            $ref: '#/definitions/BadRequestResponse'
        '502':
          description: DB API request failed
          schema:
            $ref: '#/definitions/BadGatewayErrorResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      summary: Update commitment evidence
      tags:
      - Course/Student
      x-access-level: public
  /v2/course/student/courses/list:
    post:
      description: Returns courses the authenticated student is enrolled in or has completed
      operationId: v2-merged-course-student-list
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/StudentCoursesResponse'
        '206':
          description: Partial content (one backend unavailable)
          schema:
            $ref: '#/definitions/StudentCoursesResponse'
        '401':
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        '502':
          description: Both backends unavailable
          schema:
            $ref: '#/definitions/ErrorResponse'
