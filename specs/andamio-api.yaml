        schema:
          $ref: '#/definitions/ListTeacherAssignmentCommitmentsRequest'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/TeacherAssignmentCommitmentsResponse'
