      tags:
      - Course/Student
      x-access-level: public
  /v2/course/student/commitment/submit:
    post:
      consumes:
      - application/json
      description: Submits an assignment commitment for teacher review using V2 schema.
      operationId: v2-course-student-submit-commitment
