      - application/json
      responses:
        '200':
          description: Submitted commitment
          schema:
            $ref: '#/definitions/AssignmentCommitment'
        '400':
          description: Invalid request body
          schema:
            $ref: '#/definitions/BadRequestResponse'
        '502':
          description: DB API request failed
          schema:
            $ref: '#/definitions/BadGatewayErrorResponse'
      security:
      - ApiKeyAuth: []
        BearerAuth: []
      summary: Submit commitment
      tags:
      - Course/Student
      x-access-level: public
  /v2/course/student/commitment/update:
    post:
      consumes:
      - application/json
      description: Updates an assignment commitment's evidence using V2 schema.
      operationId: v2-course-student-update-commitment
