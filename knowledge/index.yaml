# Sync discipline
#
# The reference/ and specs/ surfaces in this repo drift from their sources
# (andamio-api code, andamio-cli releases, andamio-app-template README) if
# not refreshed. Run a sync check periodically:
#
#   1. Refresh specs/andamio-api.yaml against andamio-api OpenAPI output.
#   2. Diff reference/status-enums.md against API enum source (paths listed
#      in that doc's Provenance section).
#   3. Diff reference/andamio-cli-context.md command list against
#      `andamio --help` and the cli release notes.
#   4. Re-run /cost-estimator against preprod and update specs/cost-registry.json.
#   5. Bump last_updated above and commit.
#
# Cadence target: every 30 days, or after any breaking API change.
